spring.application.name=lab1psp
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# Путь к файлу каталога
catalog.file-path=catalog.json

# ЛР 1–3 запускаются без базы. Профиль db включает JPA и Liquibase.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
