syntax = "proto3";

package catalog.v1;
option java_package = "org.example.grpc.contract";
option java_multiple_files = true;
option java_outer_classname = "CatalogProtocol";

service CatalogService {
  rpc GetAll (Empty) returns (stream ItemMessage);
  rpc GetById (IdRequest) returns (ItemMessage);
  rpc Add (ItemMessage) returns (ItemMessage);
  rpc Update (ItemMessage) returns (ItemMessage);
  rpc Delete (IdRequest) returns (Empty);
}

message Empty {}
message IdRequest { int64 id = 1; }
message BookDetails { string author = 1; int32 page_count = 2; }
message JournalDetails { string publisher = 1; int32 issue_number = 2; }

message ItemMessage {
  int64 id = 1;
  string name = 2;
  string price = 3;
  oneof details {
    BookDetails book = 4;
    JournalDetails journal = 5;
  }
}
